# MirrorMaker 2 - E-commerce: Primary -> Standby (DR) replication
# Replicates order-events and payment-events for OrderService & PaymentService.

clusters = primary, standby

primary.bootstrap.servers = kafka-primary:9092
standby.bootstrap.servers = kafka-standby:9092

primary->standby.enabled = true
# Order and payment event topics (1 partition each for demo)
primary->standby.topics = order-events,payment-events
primary->standby.topics.replication.factor = 1
primary->standby.sync.topic.acls.enabled = false

tasks.max = 1
offset.storage.topic = mm2-offsets
config.storage.topic = mm2-configs
status.storage.topic = mm2-status

replication.policy.class = org.apache.kafka.connect.mirror.DefaultReplicationPolicy
