name: Build and Push Docker Images

on:
  push:
    branches: [enhanced-mm2]
  workflow_dispatch:  # allows manual trigger

jobs:
  build-producer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build Commit Log Producer
        run: |
          mkdir -p producer-build/src/main/java/com/kafka/replication/producer
          mkdir -p producer-build/src/main/resources

          # Create pom.xml
          cat > producer-build/pom.xml << 'POMEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0">
              <modelVersion>4.0.0</modelVersion>
              <groupId>com.kafka.replication</groupId>
              <artifactId>commit-log-producer</artifactId>
              <version>1.0.0</version>
              <packaging>jar</packaging>
              <properties>
                  <maven.compiler.source>17</maven.compiler.source>
                  <maven.compiler.target>17</maven.compiler.target>
              </properties>
              <dependencies>
                  <dependency>
                      <groupId>org.apache.kafka</groupId>
                      <artifactId>kafka-clients</artifactId>
                      <version>3.7.0</version>
                  </dependency>
                  <dependency>
                      <groupId>com.fasterxml.jackson.core</groupId>
                      <artifactId>jackson-databind</artifactId>
                      <version>2.17.0</version>
                  </dependency>
                  <dependency>
                      <groupId>org.slf4j</groupId>
                      <artifactId>slf4j-api</artifactId>
                      <version>2.0.12</version>
                  </dependency>
                  <dependency>
                      <groupId>ch.qos.logback</groupId>
                      <artifactId>logback-classic</artifactId>
                      <version>1.5.3</version>
                  </dependency>
              </dependencies>
              <build>
                  <plugins>
                      <plugin>
                          <groupId>org.apache.maven.plugins</groupId>
                          <artifactId>maven-shade-plugin</artifactId>
                          <version>3.5.2</version>
                          <executions>
                              <execution>
                                  <phase>package</phase>
                                  <goals><goal>shade</goal></goals>
                                  <configuration>
                                      <transformers>
                                          <transformer implementation="org.apache.maven.plugins.shade.resource.ManifestResourceTransformer">
                                              <mainClass>com.kafka.replication.producer.CommitLogProducer</mainClass>
                                          </transformer>
                                      </transformers>
                                  </configuration>
                              </execution>
                          </executions>
                      </plugin>
                  </plugins>
              </build>
          </project>
          POMEOF

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Producer Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .github/Dockerfile.producer
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/commit-log-producer:latest

  build-mm2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build Enhanced Kafka (MM2 only)
        run: |
          ./gradlew :connect:mirror:jar -x test

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Enhanced MM2 Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .github/Dockerfile.mm2
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/enhanced-mm2:latest
