# =============================================================================
# Enhanced MirrorMaker 2 configuration (dedicated mode)
#
# Replicates the `commit-log` topic from the primary cluster (alias: primary)
# to the disaster-recovery cluster (alias: dr). With the DefaultReplicationPolicy
# the topic appears on the DR cluster as `primary.commit-log`, exactly as the
# project specification requires.
#
# This config is consumed by `connect-mirror-maker.sh`, which runs the modified
# MirrorSourceConnector / MirrorSourceTask that contains the truncation-detection
# (Task 2) and topic-reset-recovery (Task 3) logic.
# =============================================================================

clusters = primary, dr

primary.bootstrap.servers = primary-kafka:29092
dr.bootstrap.servers = dr-kafka:29092

# Replicate primary -> dr only (one-directional, PR -> DR).
primary->dr.enabled = true
primary->dr.topics = commit-log

# We do not replicate back from dr -> primary.
dr->primary.enabled = false

# Single-node clusters: everything is replication factor 1.
replication.factor = 1
checkpoints.topic.replication.factor = 1
heartbeats.topic.replication.factor = 1
offset-syncs.topic.replication.factor = 1
offset.storage.replication.factor = 1
status.storage.replication.factor = 1
config.storage.replication.factor = 1

# Keep MM2 from renaming with a long prefix chain and replicate config faithfully.
replication.policy.separator = .
sync.topic.configs.enabled = true
refresh.topics.enabled = true
# Refresh quickly so a recreated source topic is re-detected promptly during the
# topic-reset test scenario.
refresh.topics.interval.seconds = 10
emit.heartbeats.enabled = true
emit.checkpoints.enabled = true

# Start replicating from the very beginning of the source topic.
primary->dr.consumer.auto.offset.reset = earliest

# Poll fairly frequently so detection runs often during the demo scenarios.
primary->dr.consumer.poll.timeout.ms = 2000

# Single task is sufficient for one partition.
tasks.max = 1
