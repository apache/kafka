name: Refresh collaborators

on:
  schedule:
    - cron: '17 6 1 1,4,7,10 *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-collaborators
  cancel-in-progress: false

jobs:
  generate-patch:
    if: github.repository == 'apache/kafka'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: trunk
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r committer-tools/requirements.txt
      - name: Refresh collaborators
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -c 'import runpy; runpy.run_path("committer-tools/refresh_collaborators.py")["main"]()'
      - name: Prepare patch
        id: patch
        run: |
          python - <<'PYTHON'
          import subprocess
          from pathlib import Path
          from ruamel.yaml import YAML

          yaml = YAML(typ="safe")
          before = yaml.load(subprocess.check_output(["git", "show", "HEAD:.asf.yaml"], text=True))
          after = yaml.load(Path(".asf.yaml").read_text())
          collaborators = after["github"].pop("collaborators")
          before["github"].pop("collaborators")
          if not isinstance(collaborators, list) or not collaborators or not all(
              isinstance(login, str) and login.strip() for login in collaborators
          ):
              raise ValueError("Refusing an empty or invalid collaborator list")
          if before != after:
              raise ValueError("Unexpected configuration changes outside collaborators")
          PYTHON
          git diff --check
          if git diff --quiet -- .asf.yaml; then
            echo 'No collaborator changes.' >> "$GITHUB_STEP_SUMMARY"
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git diff -- .asf.yaml > collaborators.patch
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo 'A collaborator update patch is available as an artifact. A committer must review and apply it, then open a normal PR. No branch or repository settings were changed.' >> "$GITHUB_STEP_SUMMARY"
            git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: steps.patch.outputs.changed == 'true'
        with:
          name: collaborators-patch
          path: collaborators.patch
          if-no-files-found: error
          retention-days: 30
