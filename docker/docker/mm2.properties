# MirrorMaker 2 Configuration
# Replicates commit-log from primary to standby cluster

# Cluster aliases
clusters = primary, standby

# Primary cluster connection
primary.bootstrap.servers = primary-kafka:9092

# Standby (DR) cluster connection
standby.bootstrap.servers = standby-kafka:9092

# Enable replication from primary -> standby
primary->standby.enabled = true
primary->standby.topics = commit-log

# Disable reverse replication
standby->primary.enabled = false

# Replication factor for MirrorMaker internal topics (single node = 1)
replication.factor = 1
checkpoints.topic.replication.factor = 1
heartbeats.topic.replication.factor = 1
offset-syncs.topic.replication.factor = 1
offset.storage.replication.factor = 1
status.storage.replication.factor = 1
config.storage.replication.factor = 1

# Source consumer configuration
primary.consumer.auto.offset.reset = earliest

# Sync consumer group offsets
sync.group.offsets.enabled = true
sync.group.offsets.interval.seconds = 5

# Refresh interval for topic discovery
refresh.topics.interval.seconds = 10

# Emit heartbeats
emit.heartbeats.enabled = true
emit.heartbeats.interval.seconds = 5

# Emit checkpoints for offset tracking
emit.checkpoints.enabled = true
emit.checkpoints.interval.seconds = 5

# Task configuration
tasks.max = 1
