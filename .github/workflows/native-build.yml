name: Native Build

on:
  push:
    branches: [ trunk, feature/* ]
  pull_request:
    branches: [ trunk ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up GraalVM
      uses: actions/setup-java@v4
      with:
        java-version: '22'
        distribution: 'graalvm-community'
        
    - name: Build with Gradle
      uses: gradle/actions/setup-gradle@v3
      
    - name: Run Tests
      run: ./gradlew :edgeml-broker:test
      
    - name: Build Native Image
      run: ./gradlew :edgeml-broker:nativeCompile
      
    - name: Upload Native Image Artifact
      uses: actions/upload-artifact@v4
      with:
        name: edgeml-broker
        path: edgeml-broker/build/native/nativeCompile/edgeml-broker
