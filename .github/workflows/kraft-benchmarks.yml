# KRaft JMH benchmark regression gate. Two modes share one job:
#   * Mode A (compare) runs on `kraft`-labeled PRs, diffs the deterministic counters against the
#     stored baseline, and fails the check on a mismatch (the `benchmark-override` label downgrades
#     that to a warning). It never pushes.
#   * Mode B (update) runs on pushes to trunk that touch KRaft paths and refreshes the baseline on
#     the `benchmark-results` orphan branch.
# See .github/scripts/benchmark_regression.py for the compare/update engine.
name: KRaft Benchmarks
on:
  push:
    branches: [trunk]
    paths: ['raft/**', 'metadata/**', 'jmh-benchmarks/**']   # baseline update
  pull_request:
    types: [opened, labeled, synchronize, reopened]           # gated on the `kraft` label below

# Serialize baseline writes across rapid trunk merges; keep PR runs independent per ref.
concurrency:
  group: kraft-benchmarks-${{ github.event_name == 'push' && 'baseline' || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # push to the orphan branch (Mode B only; fork PRs get a read-only token regardless)

jobs:
  kraft-benchmarks:
    name: KRaft Benchmarks
    runs-on: ubuntu-24.04
    if: >-
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'kraft')
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Setup Gradle
        uses: ./.github/actions/setup-gradle
        with:
          java-version: 17

      - name: Setup Python
        uses: ./.github/actions/setup-python

      - name: Checkout baseline branch
        id: baseline
        uses: actions/checkout@v5
        continue-on-error: true       # branch may not exist before the first Mode B run
        with:
          ref: benchmark-results
          path: baseline
          persist-credentials: true

      - name: Ensure baseline directory
        run: mkdir -p baseline/benchmarks

      # Honor the fork/iteration counts baked into the benchmark annotations (ElectionBenchmarks:
      # 5 forks SingleShot; LeaderBenchmarks: 3 forks AverageTime) rather than overriding to -f 1,
      # which would remove JMH's fork-variance defense. -prof gc adds gc.alloc.rate.norm (bytes/op).
      # NOTE: build.gradle splits jmhArgs on spaces, so every token here must be space-free.
      - name: Run raft JMH benchmarks
        run: >-
          ./gradlew :jmh-benchmarks:jmh
          -DjmhArgs="-rf json -rff jmh-result.json -foe true -prof gc -jvmArgsAppend -Xmx2g org.apache.kafka.jmh.raft"

      - name: Upload JMH result
        uses: actions/upload-artifact@v4
        with:
          name: jmh-result
          path: jmh-result.json

      - name: Compare or update baseline
        env:
          OVERRIDE: ${{ contains(github.event.pull_request.labels.*.name, 'benchmark-override') }}
        run: |
          python .github/scripts/benchmark_regression.py \
            --result jmh-result.json \
            --baseline-dir baseline/benchmarks \
            --mode ${{ github.event_name == 'push' && 'update' || 'compare' }} \
            --override "$OVERRIDE" >> "$GITHUB_STEP_SUMMARY"

      - name: Push baseline
        if: github.event_name == 'push'
        working-directory: baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # First run: the branch did not exist, so seed it as an orphan with a token-authed remote.
          if [ ! -d .git ]; then
            git init -b benchmark-results
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi
          git add benchmarks
          git diff --quiet && git diff --staged --quiet \
            || git commit -m "Update KRaft benchmark baseline for ${GITHUB_SHA}"
          git push origin HEAD:benchmark-results
