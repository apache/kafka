// This file contains tasks for the gradle wrapper generation.
//
// To upgrade Gradle, run:
//   ./gradlew wrapper --gradle-version <version>
// The published distribution checksum, the published wrapper jar checksum and the gradle/gradle commit to
// fetch the wrapper jar from are looked up automatically and written into gradle/wrapper/gradle-wrapper.properties
// and gradlew.
// Read more about the wrapper here: https://docs.gradle.org/current/userguide/gradle_wrapper.html

import groovy.json.JsonSlurper
import java.security.MessageDigest

def fetchBytes = { String url ->
    HttpURLConnection conn = (HttpURLConnection) URI.create(url).toURL().openConnection()
    conn.connectTimeout = 15_000
    conn.readTimeout = 60_000
    conn.setRequestProperty("User-Agent", "apache-kafka-build")
    try {
        conn.inputStream.withCloseable { it.bytes }
    } catch (IOException e) {
        // Without this the failure surfaces as a bare FileNotFoundException or IOException holding just the URL.
        int code = -1
        try { code = conn.responseCode } catch (IOException ignored) { }
        throw new GradleException("Failed to fetch $url${code > 0 ? " (HTTP $code)" : ""}", e)
    }
}
def fetchText = { String url -> new String(fetchBytes(url), "UTF-8").trim() }
def sha256 = { byte[] bytes -> MessageDigest.getInstance("SHA-256").digest(bytes).encodeHex().toString() }

// Resolved by the wrapper task and consumed by bootstrapWrapper below.
String wrapperChecksum = null
String wrapperJarUrl = null

wrapper.doFirst {
    String gradleVersion = wrapper.gradleVersion
    String distChecksum = fetchText("${wrapper.distributionUrl}.sha256")
    wrapper.distributionSha256Sum = distChecksum
    logger.lifecycle("Gradle $gradleVersion distribution: $distChecksum")
    wrapperChecksum = fetchText("https://services.gradle.org/distributions/gradle-${gradleVersion}-wrapper.jar.sha256")

    // Gradle doesn't publish the wrapper jar as a standalone download, so fetch it from the gradle/gradle
    // repository. A release tag contains the bootstrap jar Gradle uses to build itself, which may be from
    // the previous version (e.g. v9.8.1), so search the master history for a commit whose jar matches the
    // published checksum instead. See https://issues.apache.org/jira/browse/KAFKA-21299.
    // Using raw.githubusercontent.com instead of github.com because github.com servers deprecated
    // TLSv1/TLSv1.1 support some time ago, so older versions of curl (built against OpenSSL library that
    // doesn't support TLSv1.2) would fail to fetch the jar.
    def commits = new JsonSlurper().parse(fetchBytes(
        "https://api.github.com/repos/gradle/gradle/commits?sha=master&path=gradle/wrapper/gradle-wrapper.jar&per_page=100"))*.sha
    String wrapperJarCommit = commits.find {
        sha256(fetchBytes("https://raw.githubusercontent.com/gradle/gradle/$it/gradle/wrapper/gradle-wrapper.jar")) == wrapperChecksum
    }
    if (wrapperJarCommit == null) {
        throw new GradleException("None of the last ${commits.size()} gradle/gradle master commits touching the wrapper jar " +
            "has one matching the published checksum $wrapperChecksum of Gradle $gradleVersion")
    }
    wrapperJarUrl = "https://raw.githubusercontent.com/gradle/gradle/$wrapperJarCommit/gradle/wrapper/gradle-wrapper.jar"
    logger.lifecycle("Gradle $gradleVersion wrapper jar: $wrapperChecksum from gradle/gradle@$wrapperJarCommit")
}

// Custom task to inject support for downloading the gradle wrapper jar if it doesn't exist.
// This allows us to avoid checking in the jar to our repository.
task bootstrapWrapper() {
    // A finalizer runs even if the wrapper task failed; don't patch gradlew in that case.
    onlyIf { wrapper.state.failure == null }
    // In the doLast block so this runs when the task is called and not during project configuration.
    doLast {
        def wrapperBasePath = "\$APP_HOME/gradle/wrapper"
        def wrapperJarPath = wrapperBasePath + "/gradle-wrapper.jar"

        def bootstrapString = """
      # Loop in case we encounter an error.
      REQUIRED_WRAPPER_JAR_CHECKSUM="$wrapperChecksum"
      for attempt in 1 2 3; do
        if [ ! -e "$wrapperJarPath" ]; then
          if ! curl -s -S --retry 3 -L -o "$wrapperJarPath" "$wrapperJarUrl"; then
            rm -f "$wrapperJarPath"
            # Pause for a bit before looping in case the server throttled us.
            sleep 5
            continue
          fi
        else
          # Verify checksum of existing wrapper JAR. 
          # This prevents developers from running into incompatibility issues when using an outdated wrapper JAR after a Gradle upgrade.
          # Use sha256sum or shasum, whichever is available.
          if command -v sha256sum >/dev/null 2>&1; then
            LOCAL_WRAPPER_JAR_CHECKSUM=\$(sha256sum "$wrapperJarPath" | awk '{print \$1}')
          elif command -v shasum >/dev/null 2>&1; then
            LOCAL_WRAPPER_JAR_CHECKSUM=\$(shasum -a 256 "$wrapperJarPath" | awk '{print \$1}')
          else
            # If no checksum tool is found, this verification is skipped .
            warn "Cannot find sha256sum or shasum to verify wrapper JAR."
            break
          fi

          # If the local checksum does not match the required checksum, delete the JAR to force re-download.
          if [ "\$LOCAL_WRAPPER_JAR_CHECKSUM" != "\$REQUIRED_WRAPPER_JAR_CHECKSUM" ] ; then
            rm -f "$wrapperJarPath"
          else
            break
          fi
        fi
      done
      """.stripIndent()

        String putBootstrapStringAbove = "# Add default JVM options here. You can also use JAVA_OPTS and GRADLE_OPTS to pass JVM options to this script."

        def wrapperScript = wrapper.scriptFile
        def wrapperLines = wrapperScript.readLines()
        wrapperScript.withPrintWriter { out ->
            def bootstrapWritten = false
            wrapperLines.each { line ->
                // Print the wrapper bootstrap before the first usage of the wrapper jar.
                if (!bootstrapWritten && line.contains(putBootstrapStringAbove)) {
                    out.println(bootstrapString)
                    bootstrapWritten = true
                }
                out.print(line)
                out.println()
            }
        }
    }
}
wrapper.finalizedBy bootstrapWrapper

// Remove the generated batch file since we don't test building in the Windows environment.
task removeWindowsScript(type: Delete) {
    delete "$rootDir/gradlew.bat"
}
wrapper.finalizedBy removeWindowsScript
