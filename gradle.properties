group=org.apache.kafka
# NOTE: When you change this version number, you should also make sure to update
# the version numbers in
#  - docs/js/templateData.js
#  - tests/kafkatest/__init__.py
#  - tests/kafkatest/version.py (variable DEV_VERSION)
#  - kafka-merge-pr.py
#  - streams/quickstart/pom.xml
#  - streams/quickstart/java/src/main/resources/archetype-resources/pom.xml
#  - streams/quickstart/java/pom.xml
version=4.0.0
scalaVersion=2.13.15
# Adding swaggerVersion in gradle.properties to have a single version in place for swagger
swaggerVersion=2.2.25
task=build

# Specifies the JVM arguments for the Gradle Daemon.
# -Xmx4g sets the maximum heap size for the daemon to 4 GB.
# OpenJ9 GC Policy: Using 'gencon' with 'concurrentScavenge' is a good general-purpose policy.
# -XX:+DisableExplicitGC prevents System.gc() calls, which can cause performance issues.
org.gradle.jvmargs=-Xgcpolicy:gencon -XX:+DisableExplicitGC -XcompilationThreads1 -Xgcthreads1 -XX:+DisableExplicitGC -Dscala.concurrent.context.numThreads=1 -Xmx2G

# Allow Gradle to run tasks in parallel for faster builds.
org.gradle.parallel=true
org.gradle.workers.max=10
# =================================================================================
# === JVM SETTINGS TO PREVENT 'java.lang.OutOfMemoryError: Failed to create a thread' ===
#
# These settings were added to address build failures on a 56-core machine with an
# IBM Semeru (OpenJ9) JDK. The error is caused by native memory exhaustion in the
# forked Scala compiler (scalac) worker process, not a lack of Java heap space.
#
# kafka.scala.worker.maxHeap: Increases the maximum Java heap size for the Scala
#   compiler worker process. The default of 2g can be insufficient for large modules.
#   Increasing this to 4g provides more memory for compilation.
#
# kafka.scala.worker.stackSize: This is the most critical setting for this issue.
#   The default thread stack size (-Xss) of 4m is too large. When scalac creates
#   hundreds of threads, this quickly exhausts the process's virtual memory address space.
#   Reducing the stack size to 2m allows for many more threads to be created,
#   resolving the "Failed to create a thread" error and stabilizing the build.
#
# kafka.scala.worker.jvmArgs: Sets specific JVM arguments for the Scala worker,
#   using the recommended OpenJ9 garbage collection policy instead of the HotSpot default.
# =================================================================================
kafka.scala.worker.maxHeap=4g
kafka.scala.worker.stackSize=2m
kafka.scala.worker.jvmArgs=-Xgcpolicy:gencon -Xgc:concurrentScavenge -XX:+DisableExplicitGC


