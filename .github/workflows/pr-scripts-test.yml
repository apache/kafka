name: Pull Request Scripts Test

on:
  pull_request:
    paths:
      - '.github/scripts/pr-format.py'
      - '.github/scripts/pr-reviewers-trailer.py'
      - '.github/scripts/test_pr_scripts.py'
      - '.github/workflows/pr-scripts-test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Run tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_pr_scripts.py' -v
