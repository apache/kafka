############################# Kafka Streams Configuration #############################

# A unique name for the Kafka Streams application.
# Used as consumer group id and for internal state topics.
# REQUIRED (no default)
application.id=my-streams-app

# Comma-separated list of Kafka brokers.
# REQUIRED (no default)
bootstrap.servers=<localhost:9092>
############################# Stream Threads #############################

# Number of stream processing threads.
# Default: 1
num.stream.threads=1
############################# Default SerDes #############################

# Default key serializer/deserializer.
# Default: org.apache.kafka.common.serialization.ByteArraySerde
default.key.serde=org.apache.kafka.common.serialization.StringSerde

# Default value serializer/deserializer.
# Default: org.apache.kafka.common.serialization.ByteArraySerde
default.value.serde=org.apache.kafka.common.serialization.StringSerde
############################# Processing Guarantees #############################

# Processing guarantee.
# Values: at_least_once, exactly_once_v2
# Default: at_least_once
processing.guarantee=at_least_once

# Commit interval for state and offsets (ms).
# Default: 30000
commit.interval.ms=30000
############################# State Store #############################

# Directory for local state stores.
# Default: /tmp/kafka-streams
state.dir=/tmp/kafka-streams

# Maximum number of standby replicas.
# Default: 0
num.standby.replicas=0
############################# Caching #############################

# Maximum memory used for buffering records (bytes).
# Default: 10485760 (10 MB)
cache.max.bytes.buffering=10485760
############################# Internal Topics #############################

# Replication factor for internal topics (changelog, repartition).
# Default: -1 (uses broker default)
replication.factor=-1
############################# Topology Optimization #############################

# Enable topology optimization.
# Values: none, all
# Default: none
topology.optimization=none
############################# Metrics #############################

# Metrics sample window size (ms).
# Default: 30000
metrics.sample.window.ms=30000
# Number of metrics samples.
# Default: 2
metrics.num.samples=2
# Metrics recording level.
# Values: INFO, DEBUG
# Default: INFO
metrics.recording.level=INFO
############################# Timestamp Extraction #####################

# Default timestamp extractor class.
# Default: FailOnInvalidTimestamp
default.timestamp.extractor=org.apache.kafka.streams.processor.FailOnInvalidTimestamp


