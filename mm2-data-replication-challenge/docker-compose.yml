services:
  primary:
    image: ${KAFKA_IMAGE:-apache/kafka:4.1.0}
    hostname: primary
    container_name: mm2-primary
    ports:
      - "29092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@primary:9093
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://primary:19092,PLAINTEXT_HOST://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_MS: 60000
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 1000
      KAFKA_LOG_SEGMENT_MS: 1000
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - primary-data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server primary:19092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [mm2-challenge]

  standby:
    image: ${KAFKA_IMAGE:-apache/kafka:4.1.0}
    hostname: standby
    container_name: mm2-standby
    ports:
      - "39092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@standby:9093
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://standby:19092,PLAINTEXT_HOST://localhost:39092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_MS: 60000
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 1000
      KAFKA_LOG_SEGMENT_MS: 1000
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: NkU4PFWCOUcxQ0JGNkU2RA
    volumes:
      - standby-data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server standby:19092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [mm2-challenge]

  topic-init:
    image: ${KAFKA_IMAGE:-apache/kafka:4.1.0}
    depends_on:
      primary:
        condition: service_healthy
      standby:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command: |
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server primary:19092 \
        --create --if-not-exists --topic commit-log --partitions 1 --replication-factor 1 \
        --config retention.ms=60000 --config segment.ms=1000
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server standby:19092 \
        --create --if-not-exists --topic primary.commit-log --partitions 1 --replication-factor 1 \
        --config retention.ms=60000 --config segment.ms=1000
    networks: [mm2-challenge]

  mm2:
    build:
      context: ..
      dockerfile: mm2-data-replication-challenge/Dockerfile.mm2
    image: shivani-mm2-offset-loss:local
    container_name: mm2-replicator
    depends_on:
      topic-init:
        condition: service_completed_successfully
    volumes:
      - ./mm2.properties:/etc/mm2/mm2.properties:ro
    networks: [mm2-challenge]

volumes:
  primary-data:
  standby-data:

networks:
  mm2-challenge:
    driver: bridge
